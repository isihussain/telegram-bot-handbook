name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly strict check: every linked file must exist, even across categories.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check docs
        if: github.event_name != 'schedule'
        run: python scripts/check_docs.py
      - name: Check docs (strict)
        if: github.event_name == 'schedule'
        run: python scripts/check_docs.py --strict
      - name: Tests
        run: |
          if [ -d tests ]; then pytest -q; fi
